import urllib.request
import xml.etree.ElementTree as ET
import html
import zipfile
import re

def leer_emisores_excel_robusto(ruta_archivo):
    emisores = []
    try:
        with zipfile.ZipFile(ruta_archivo, 'r') as z:
            shared_strings = []
            if 'xl/sharedStrings.xml' in z.namelist():
                with z.open('xl/sharedStrings.xml') as strings_file:
                    content = strings_file.read().decode('utf-8')
                    shared_strings = re.findall(r'<t[^>]*>(.*?)</t>', content)

            with z.open('xl/worksheets/sheet1.xml') as sheet:
                content = sheet.read().decode('utf-8')
                filas = re.findall(r'<row[^>]*>(.*?)</row>', content)
                for fila in filas:
                    celdas = re.findall(r'<c[^>]*>(.*?)</c>', fila)
                    if celdas:
                        primera_celda = celdas[0]
                        es_shared = 't="s"' in fila or 't="s"' in re.search(r'<c[^>]*>', fila).group(0) if re.search(r'<c[^>]*>', fila) else False
                        v_match = re.search(r'<v>(.*?)</v>', primera_celda)
                        if v_match:
                            valor = v_match.group(1)
                            if es_shared and shared_strings:
                                try: texto = shared_strings[int(valor)]
                                except: texto = valor
                            else: texto = valor
                            texto_limpio = re.sub(r'<[^>]+>', '', texto).strip()
                            if texto_limpio:
                                emisores.append(texto_limpio)
    except Exception as e:
        print(f"Error al leer Excel: {e}")
    if emisores and emisores[0].lower() in ['emisores', 'emisor', 'nombre', 'empresa', 'empresas', 'columna1']:
        emisores.pop(0)
    return list(set([e for e in emisores if len(e) > 1]))

# 1. Cargar tus emisores desde el Excel
emisores = leer_emisores_excel_robusto("Emisores.xlsx")
if not emisores:
    emisores = ["Pacífico Seguros", "Interseguro", "Rímac Seguros", "Credicorp", "Intercorp"]

print(f"Emisores a monitorear: {emisores}")

noticias_totales = []
hechos_relevantes = []

# 2. SECCIÓN SMV: Descargar Hechos Relevantes del mercado peruano
print("Consultando Hechos Relevantes en la SMV...")
url_smv = "https://www.smv.gob.pe/Frm_HechosRelevantesRSS?id=0" # RSS oficial de la SMV
try:
    req_smv = urllib.request.Request(url_smv, headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(req_smv, timeout=15) as response:
        xml_smv = response.read()
    root_smv = ET.fromstring(xml_smv)
    
    for item in root_smv.findall('.//item'):
        titulo = item.find('title').text if item.find('title') is not None else ""
        link = item.find('link').text if item.find('link') is not None else ""
        fecha = item.find('pubDate').text if item.find('pubDate') is not None else ""
        descripcion = item.find('description').text if item.find('description') is not None else ""
        
        # Combinamos título y descripción para buscar si pertenece a tus emisores
        texto_analizar = (titulo + " " + descripcion).lower()
        
        for emisor in emisores:
            # Si el nombre del emisor (o palabras clave) está en el hecho relevante, lo guardamos
            if emisor.lower() in texto_analizar or (len(emisor) > 5 and emisor.lower()[:5] in texto_analizar):
                hechos_relevantes.append({
                    "emisor": emisor,
                    "titulo": titulo.replace("Hecho Relevante -", "").strip(),
                    "link": link,
                    "fecha": fecha,
                    "fuente": "SMV / BVL"
                })
                break # Evita duplicar si hace match con más de una regla
except Exception as e:
    print(f"Nota: No se pudo conectar a la SMV en este momento (Razón: {e}).")

# 3. SECCIÓN GOOGLE NEWS: Buscar noticias generales de cada emisor
print("Consultando Google News...")
for emisor in emisores:
    query = urllib.parse.quote(f"{emisor} Peru")
    url = f"https://news.google.com/rss/search?q={query}&hl=es-419&gl=PE&ceid=PE:es-419"
    try:
        req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
        with urllib.request.urlopen(req, timeout=15) as response:
            xml_data = response.read()
        root = ET.fromstring(xml_data)
        count = 0
        for item in root.findall('.//item'):
            if count >= 3: break
            titulo = item.find('title').text
            link = item.find('link').text
            fecha = item.find('pubDate').text
            fuente = item.find('source').text if item.find('source') is not None else "Gestión / El Comercio"
            
            noticias_totales.append({
                "emisor": emisor,
                "titulo": titulo,
                "link": link,
                "fecha": fecha,
                "fuente": fuente
            })
            count += 1
    except Exception as e:
        print(f"Error en noticias para {emisor}: {e}")

