name: Actualizacion Diaria de Noticias

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Ejecutar script de noticias
      run: python actualizar_noticias.py

    - name: Guardar cambios y subir a GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        if ! git diff-index --quiet HEAD; then
          git commit -m "Actualización automática de noticias"
          git push origin main --force
        else
          print "No hay cambios en las noticias para subir."
        fi
