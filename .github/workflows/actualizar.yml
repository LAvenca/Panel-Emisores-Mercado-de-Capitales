- name: Guardar cambios y subir a GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        # Asegurar que el robot tenga los últimos cambios antes de subir
        git pull --rebase origin main
        git add index.html
        git diff-index --quiet HEAD || git commit -m "Actualización automática de noticias"
        git push origin main
